name: Pipeline

# Hourly: collect → triage → draft → resolve → gate → publish, plus source scoring and review expiry.
# Long agent runs live here, not in Vercel request handlers.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "pipeline command (run, collect, triage, process, seed, snowball, jobs, maintenance)"
        default: run

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      PROCESS_LIMIT: ${{ vars.PROCESS_LIMIT || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run pipeline -- ${{ github.event.inputs.command || 'run' }}
